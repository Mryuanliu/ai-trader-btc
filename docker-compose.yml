services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-trader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_trader
      POSTGRES_PASSWORD: ai_trader_pwd
      POSTGRES_DB: ai_trader
    ports:
      - '5432:5432'
    volumes:
      - ai-trader-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ai_trader -d ai_trader']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-trader-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ai-trader-pgdata:
